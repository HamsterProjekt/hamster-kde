# SonarQube Cloud analysis, run by .github/workflows/sonarcloud.yml
sonar.projectKey=HamsterProjekt_hamster-kde
sonar.organization=hamsterprojekt
sonar.projectName=hamster-kde

# SonarQube Cloud analyses the whole repository; sonar.sources and
# sonar.tests have no effect.
sonar.exclusions=**/__pycache__/**
# Leave the tests themselves out of the coverage (sonar.test.inclusions
# has no effect either).
sonar.coverage.exclusions=tests/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
