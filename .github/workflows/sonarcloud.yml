# Runs the Python tests that need no Plasma with coverage, and analyses the
# code on SonarQube Cloud (project HamsterProjekt_hamster-kde).
# The scan is skipped without the SONAR_TOKEN secret, as in pull requests
# from forks.
name: SonarQube Cloud
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Prepare repo
        uses: actions/checkout@v7
        with:
          # full history, so that new code and blame are right
          fetch-depth: 0
      - name: Run the Python tests with coverage
        # With the system Python and Ubuntu's packages, not pip. PyQt6 and
        # PyGObject are for app/hamsterbus.py; its tests need no D-Bus.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-coverage python3-gi python3-pyqt6
          python3 -m coverage erase
          for test in tests/test_*.py; do
            python3 -m coverage run --append --source=app "$test"
          done
          python3 -m coverage xml -o coverage.xml
      - name: Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65  # v8.4.1
