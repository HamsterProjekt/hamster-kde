# Runs the Python tests that need no Plasma with coverage, and analyses the
# code on SonarQube Cloud (project HamsterProjekt_hamster-kde).
# The scan is skipped without the SONAR_TOKEN secret, as in pull requests
# from forks.
name: SonarQube Cloud
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Prepare repo
        uses: actions/checkout@v4
        with:
          # full history, so that new code and blame are right
          fetch-depth: 0
      - name: Run the report tests with coverage
        # With the system Python and Ubuntu's coverage package, not pip.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-coverage
          python3 -m coverage run --source=app tests/test_reports.py
          python3 -m coverage xml -o coverage.xml
      - name: Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65  # v8.4.1
