# Builds the Flatpak (flatpak/build.sh), with the Hamster service from the
# main branch of HamsterProjekt/hamster. Pull requests get the bundle as a
# build artifact; every merge to main also publishes it as a new release, so
# that the latest one is always at
# https://github.com/HamsterProjekt/hamster-kde/releases/latest/download/hamster-kde.flatpak
# The release also has the Plasma widget, hamster-kde.plasmoid, and
# install-flatpak-widget.sh, which installs it next to the Flatpak.
# and pushes it to GitHub Packages as ghcr.io/hamsterprojekt/hamster-kde-flatpak
# (tags: latest and the release's version).
name: Flatpak
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Build the Flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to publish the release
      packages: write   # to push the bundle to ghcr.io
    env:
      FLATPAK_WORK: ${{ github.workspace }}/../flatpak-work
    steps:
      - name: Prepare repo
        uses: actions/checkout@v7
      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Cache the downloads of flatpak-builder
        uses: actions/cache@v6
        with:
          path: ${{ env.FLATPAK_WORK }}/state
          key: flatpak-state-${{ hashFiles('flatpak/*.yml') }}
          restore-keys: flatpak-state-
      - name: Build and bundle
        run: flatpak/build.sh --no-install --bundle
      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: hamster-kde-flatpak
          path: hamster-kde.flatpak
      - name: Set the version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "version=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Package the widget
        run: scripts/package-plasmoid.sh hamster-kde.plasmoid "${version:-}"
      - name: Upload the widget
        uses: actions/upload-artifact@v7
        with:
          name: hamster-kde-plasmoid
          path: |
            hamster-kde.plasmoid
            scripts/install-flatpak-widget.sh
      - name: Publish a release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hamster="$(git ls-remote https://github.com/HamsterProjekt/hamster.git refs/heads/main | cut -f1)"
          gh release create "flatpak-$version" hamster-kde.flatpak \
            hamster-kde.plasmoid scripts/install-flatpak-widget.sh \
            --target "$GITHUB_SHA" --latest \
            --title "Hamster for KDE $version (Flatpak)" \
            --notes "Flatpak of Hamster for KDE, built from $GITHUB_SHA with the Hamster service of HamsterProjekt/hamster $hamster.

          Install it for your user with:

              flatpak install --user hamster-kde.flatpak

          For the Plasma widget, download hamster-kde.plasmoid and install-flatpak-widget.sh into the same folder and run:

              sh install-flatpak-widget.sh

          The runtime comes from Flathub."
      - name: Install oras
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63  # v2.0.3
      - name: Push the bundle to GitHub Packages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push "ghcr.io/hamsterprojekt/hamster-kde-flatpak:$version,latest" \
            --artifact-type application/vnd.flatpak.bundle \
            --annotation "org.opencontainers.image.source=https://github.com/HamsterProjekt/hamster-kde" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.version=$version" \
            --annotation "org.opencontainers.image.licenses=GPL-3.0-or-later" \
            hamster-kde.flatpak:application/vnd.flatpak.bundle
